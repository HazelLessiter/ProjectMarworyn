name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - 'Update/**'

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "Diff saved to pr_diff.txt"

      - name: Fetch linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prBody = context.payload.pull_request.body || '';
            const pattern = /(?:closes?|fixes?|resolves?)\s+#(\d+)/gi;
            const numbers = new Set();
            let match;
            while ((match = pattern.exec(prBody)) !== null) {
              numbers.add(parseInt(match[1]));
            }
            const issues = [];
            for (const number of numbers) {
              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number
                });
                issues.push({
                  number: data.number,
                  title: data.title,
                  body: data.body || '',
                  labels: data.labels.map(l => l.name)
                });
              } catch (e) {
                console.log(`Could not fetch issue #${number}: ${e.message}`);
              }
            }
            fs.writeFileSync('linked_issues.json', JSON.stringify(issues, null, 2));
            console.log(`Fetched ${issues.length} linked issue(s)`);

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Find existing Claude review comment
        id: find-comment
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            const claudeComment = comments.data.find(c =>
              c.body.startsWith('<!-- claude-pr-review -->')
            );
            return claudeComment ? claudeComment.id : null;

      - name: Request Claude review
        id: claude-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EXISTING_COMMENT_ID: ${{ steps.find-comment.outputs.result }}
        run: node .github/workflows/claude-pr-review.js

      - name: Post review comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('claude_review.txt', 'utf8');

            const comment = `<!-- claude-pr-review -->
            ## 🤖 Claude AI Code Review

            ${review}

            ---
            *This review was automatically generated by Claude AI. Please use your judgment when considering this feedback.*`;

            const existingCommentId = ${{ steps.find-comment.outputs.result }};

            if (existingCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingCommentId,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });
            }

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: |
            claude_review.txt
            pr_diff.txt
            linked_issues.json
