name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - 'Update/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "Diff saved to pr_diff.txt"

      - name: Get PR details and request Claude review
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            
            // Get PR details
            const pr = context.payload.pull_request;
            const title = pr.title;
            const description = pr.body || 'No description provided';
            const author = pr.user.login;
            
            // Read diff
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            
            // Read AGENTS.md if it exists
            let agentsContext = '';
            try {
              agentsContext = fs.readFileSync('AGENTS.md', 'utf8');
            } catch (e) {
              console.log('AGENTS.md not found, continuing without it');
            }
            
            // Prepare prompt
            const prompt = `You are reviewing a pull request for the ProjectMarworyn project.

## Project Context

This is a .NET 9 console application for population simulation. Please review the code with the project's standards in mind.

### Project Standards (from AGENTS.md):
\`\`\`
${agentsContext}
\`\`\`

## Pull Request Details
**Title:** ${title}
**Description:** ${description}
**Author:** ${author}

## Changes
\`\`\`diff
${diff}
\`\`\`

## Review Instructions

Please provide a thorough code review covering:
1. **Code Quality**: Does the code follow the project's coding standards?
2. **Architecture**: Does it fit the established patterns (DI, service extension pattern)?
3. **Potential Issues**: Any bugs, edge cases, or problems?
4. **Best Practices**: .NET 9 best practices and patterns
5. **Performance**: Any performance concerns?
6. **Testing**: Should unit tests be added or updated?
7. **Positive Feedback**: What's done well?

Format your review as:
- Use markdown
- Start with a summary (approve/request changes/comment)
- Use emoji to categorize feedback (🎯 for critical, ⚠️ for suggestions, ✅ for positives)
- Be constructive and specific
- Provide code examples for suggestions when helpful`;
            
            // Call Claude API
            const apiKey = process.env.ANTHROPIC_API_KEY;
            if (!apiKey) {
              throw new Error('ANTHROPIC_API_KEY is not set');
            }
            
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-3-5-sonnet-20241022',
                max_tokens: 4096,
                messages: [
                  {
                    role: 'user',
                    content: prompt
                  }
                ]
              })
            });
            
            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`Claude API error: ${response.status} - ${errorText}`);
            }
            
            const data = await response.json();
            const review = data.content[0].text;
            
            // Save review to file
            fs.writeFileSync('claude_review.txt', review);
            console.log('Review generated successfully');
            
            // Post comment
            const comment = `## 🤖 Claude AI Code Review

${review}

---
*This review was automatically generated by Claude AI. Please use your judgment when considering this feedback.*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: comment
            });

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review
          path: |
            claude_review.txt
            pr_diff.txt
